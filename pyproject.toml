[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g3xn"
version = "0.1.0"
description = "Build, edit and play Zoom G3n / G3Xn patches from code, the command line, or an AI agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mido>=1.3", "python-rtmidi>=1.5"]

[project.optional-dependencies]
tools = ["pyelftools>=0.31"]   # only needed to rebuild the effect catalog from .ZD2 files

[project.scripts]
g3xn = "g3xn.cli:main"

[tool.setuptools]
packages = ["g3xn"]

[tool.setuptools.package-data]
g3xn = ["data/*.json"]
