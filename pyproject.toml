[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "g3xn"
version = "0.1.0"
description = "Build, edit and play Zoom G3n / G3Xn patches from code, the command line, or an AI agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mido>=1.3", "python-rtmidi>=1.5"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]             # the g3xn-mcp server for Claude Code / Claude Desktop
tools = ["pyelftools>=0.31"]   # only needed to rebuild the effect catalog from .ZD2 files
app = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13", "pywebview>=5"]   # g3xn-daemon and the g3xn-app window
voice = ["faster-whisper>=1.0", "sounddevice>=0.4", "numpy>=1.24"]   # push to talk: speech to text on this computer

[project.scripts]
g3xn = "g3xn.cli:main"
g3xn-mcp = "g3xn.mcp_server:main"
g3xn-daemon = "g3xn.daemon:main"
g3xn-app = "g3xn.desktop:main"

[tool.setuptools]
packages = ["g3xn"]

[tool.setuptools.package-data]
g3xn = ["data/*.json"]
